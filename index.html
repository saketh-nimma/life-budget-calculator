<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Finance Simulator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <h1>Personal Finance Simulator</h1>
  <p class="subtitle">Explore how income, spending, and saving affect your future.</p>

  <!-- INPUTS -->
  <div class="panel">
    <h2>Inputs</h2>

    <label>Monthly Income ($)</label>
    <input type="number" id="income" value="4500">

    <label>Monthly Expenses ($)</label>
    <input type="number" id="expenses" value="2500">

    <label>Savings Rate (%)</label>
    <input type="number" id="savingsRate" value="20">

    <label>Annual Investment Return (%)</label>
    <input type="number" id="returnRate" value="7">

    <button id="calculateBtn">Calculate</button>
  </div>

  <!-- SUMMARY -->
  <div class="panel summary">
    <h2>Summary</h2>
    <p id="summaryText"></p>
  </div>

  <!-- CHARTS -->
  <div class="charts">
    <div class="chart-box">
      <h3>Net Worth Over Time</h3>
      <canvas id="lineChart"></canvas>
    </div>

    <div class="chart-box">
      <h3>Monthly Allocation</h3>
      <canvas id="pieChart"></canvas>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>

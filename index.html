<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Personal Finance Simulator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="app">
  <h1>Personal Finance Simulator</h1>
  <p class="subtitle">Adjust the sliders to see how your financial future changes.</p>

  <!-- INPUTS -->
  <div class="panel">
    <h2>Inputs</h2>

    <div class="input-row">
      <label>Monthly Income ($)</label>
      <input type="range" id="incomeRange" min="1000" max="10000" value="4500">
      <input type="number" id="incomeNum" value="4500">
    </div>

    <div class="input-row">
      <label>Monthly Expenses ($)</label>
      <input type="range" id="expenseRange" min="500" max="8000" value="2500">
      <input type="number" id="expenseNum" value="2500">
    </div>

    <div class="input-row">
      <label>Savings Rate (%)</label>
      <input type="range" id="savingsRange" min="0" max="50" value="20">
      <input type="number" id="savingsNum" value="20">
    </div>

    <div class="input-row">
      <label>Annual Return (%)</label>
      <input type="range" id="returnRange" min="0" max="12" value="7">
      <input type="number" id="returnNum" value="7">
    </div>
  </div>

  <!-- SUMMARY -->
  <div class="summary">
    <h2>Summary</h2>
    <p id="summaryText"></p>
  </div>

  <!-- CHARTS -->
  <div class="charts">
    <div class="chart-box">
      <h3>Net Worth Over 30 Years</h3>
      <canvas id="netWorthChart" height="260"></canvas>
    </div>

    <div class="chart-box">
      <h3>Monthly Allocation</h3>
      <canvas id="allocationChart" height="260"></canvas>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>

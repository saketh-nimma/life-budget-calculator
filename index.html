<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive Personal Finance Simulator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
<div class="container">

  <h1>💼 Personal Finance Simulator</h1>
  <p class="subtitle">Adjust your financial decisions and instantly see long-term outcomes.</p>

  <div class="inputs">
    <label>Monthly Income ($): <span id="incomeVal"></span></label>
    <input type="range" id="income" min="1000" max="12000" value="4500">

    <label>Housing ($): <span id="rentVal"></span></label>
    <input type="range" id="rent" min="300" max="5000" value="1500">

    <label>Food ($): <span id="foodVal"></span></label>
    <input type="range" id="food" min="100" max="2000" value="500">

    <label>Transportation ($): <span id="transportVal"></span></label>
    <input type="range" id="transport" min="0" max="2000" value="300">

    <label>Savings Rate (%): <span id="saveVal"></span></label>
    <input type="range" id="savings" min="0" max="50" value="15">

    <label>Investment Return (%): <span id="returnVal"></span></label>
    <input type="range" id="return" min="0" max="12" value="7">

    <label>Inflation (%): <span id="inflationVal"></span></label>
    <input type="range" id="inflation" min="0" max="6" value="2">
  </div>

  <div class="dashboard">
    <div class="card" id="healthCard"></div>
    <div class="card" id="emergencyCard"></div>
    <div class="card" id="summaryCard"></div>
  </div>

  <div class="charts">
    <div class="chart-card">
      <h3>📈 Net Worth Over Time</h3>
      <canvas id="netWorthChart"></canvas>
    </div>

    <div class="chart-card">
      <h3>🥧 Monthly Allocation</h3>
      <canvas id="allocationChart"></canvas>
    </div>
  </div>

  <div class="insights">
    <h2>💡 Insights</h2>
    <p id="insightText"></p>
  </div>

  <div class="export">
    <button onclick="downloadPlan()">⬇️ Download Financial Plan</button>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>

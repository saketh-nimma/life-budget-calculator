<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Personal Finance Simulator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="app">
  <h1>Personal Finance Simulator</h1>
  <p class="subtitle">
    Compare two financial scenarios and download your results.
  </p>

  <!-- Scenario Controls -->
  <div class="panel">
    <h2>Scenario Inputs</h2>
    <div class="scenario-toggle">
      <button onclick="setScenario('A')" id="btnA">Scenario A</button>
      <button onclick="setScenario('B')" id="btnB">Scenario B</button>
    </div>

    <!-- Inputs -->
    <div class="input-row">
      <label>Monthly Income ($)</label>
      <input type="range" id="incomeRange" min="1000" max="12000">
      <input type="number" id="incomeNum">
    </div>

    <div class="input-row">
      <label>Monthly Expenses ($)</label>
      <input type="range" id="expenseRange" min="500" max="9000">
      <input type="number" id="expenseNum">
    </div>

    <div class="input-row">
      <label>Savings Rate (%)</label>
      <input type="range" id="savingsRange" min="0" max="50">
      <input type="number" id="savingsNum">
    </div>

    <div class="input-row">
      <label>Annual Return (%)</label>
      <input type="range" id="returnRange" min="0" max="12">
      <input type="number" id="returnNum">
    </div>

    <button class="save-btn" onclick="saveScenario()">Save Scenario</button>
    <button class="download-btn" onclick="downloadCSV()">Download Results</button>
  </div>

  <!-- Charts -->
  <div class="charts">
    <div class="chart-box">
      <h3>Net Worth Over 30 Years</h3>
      <div class="chart-wrapper">
        <canvas id="netChart"></canvas>
      </div>
    </div>

    <div class="chart-box">
      <h3>Monthly Allocation</h3>
      <div class="chart-wrapper">
        <canvas id="allocationChart"></canvas>
      </div>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
